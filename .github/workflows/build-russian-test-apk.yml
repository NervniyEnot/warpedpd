name: Build Russian test APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-russian-test-apk.yml'
      - 'core/src/main/assets/messages/**/*_ru.properties'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Create a temporary debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Android Debug,O=Android,C=US' \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -noprompt
          fi

      - name: Build installable GitHub debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :android:assembleGithubDebug --no-daemon --stacktrace

      - name: Check that all Russian game text resources are packaged
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          apks = sorted(Path('android/build/outputs/apk/github/debug').glob('*.apk'))
          assert apks, 'Gradle finished but no APK was found'
          with ZipFile(apks[0]) as package:
              ru = [name for name in package.namelist()
                    if name.startswith('assets/messages/') and name.endswith('_ru.properties')]
              assert len(ru) == 25, f'Expected 25 Russian text files in APK; found {len(ru)}'
              for item in ru:
                  package.read(item).decode('utf-8')
          print(f'APK: {apks[0]} — all {len(ru)} Russian files present and valid UTF-8')
          PYCODE

      - name: Upload APK for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: warpedpd-ru-android-debug-apk
          path: android/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
